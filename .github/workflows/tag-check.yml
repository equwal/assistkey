name: tag-check

# F-Droid builds each new v* tag by itself. This workflow checks the tag first.
on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches gradle.properties
        run: |
          name=$(sed -n 's/^assistkey.versionName=//p' gradle.properties)
          code=$(sed -n 's/^assistkey.versionCode=//p' gradle.properties)
          test "v$name" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match versionName $name"; exit 1; }
          test -f "fastlane/metadata/android/en-US/changelogs/$code.txt" || { echo "Missing changelogs/$code.txt"; exit 1; }
          grep -q "^## $name " CHANGELOG.md || { echo "CHANGELOG.md has no entry for $name"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unit tests and F-Droid build
        run: ./gradlew testFullDebugUnitTest assembleFdroidRelease

      - name: F-Droid build has no bundled app and no billing library
        run: |
          apk=$(ls app/build/outputs/apk/fdroid/release/*.apk)
          if unzip -l "$apk" | grep -q "assets/bundled"; then echo "Bundled app in APK"; exit 1; fi
          for dex in $(unzip -Z1 "$apk" | grep '\.dex$'); do
            if unzip -p "$apk" "$dex" | grep -aq "billingclient"; then echo "Billing library in APK"; exit 1; fi
          done
